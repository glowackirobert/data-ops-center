# ------------------------------------------------------------
# Kafka StatefulSet — KRaft mode (apache/kafka 4.x, ZK-free)
# Base is environment-neutral — never apply directly.
# Use an overlay: kubectl apply -k k8s/02-kafka/overlays/dev|prod
#
# - KAFKA_NODE_ID and KAFKA_ADVERTISED_LISTENERS set per-pod by init container
# - Custom image kafka-jmx:4.1.1 has JMX agent JAR baked in;
#   build and load with: bash k8s/02-kafka/build.sh [dev|prod]
# - CLUSTER_ID must be fixed so all pods agree; regenerate with:
#   kubectl exec -it kafka-0 -n data-ops-center -- /opt/kafka/bin/kafka-storage.sh random-uuid
# ------------------------------------------------------------

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: data-ops-center
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: dev-data-ops-center
    app.kubernetes.io/component: kafka
spec:
  serviceName: kafka-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: dev-data-ops-center
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/instance: dev-data-ops-center
        app.kubernetes.io/component: kafka
    spec:
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: kafka
                  app.kubernetes.io/instance: dev-data-ops-center
                  app.kubernetes.io/component: kafka
      initContainers:
        - name: init-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              ordinal=${HOSTNAME##*-}
              node_id=$((ordinal + 1))
              dns_name="${HOSTNAME}.kafka-headless.data-ops-center.svc.cluster.local"
              printf 'KAFKA_NODE_ID=%s\n'                                "${node_id}"  > /opt/kafka-config/envfile
              printf 'KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://%s:9092\n' "${dns_name}" >> /opt/kafka-config/envfile
          volumeMounts:
            - name: kafka-config
              mountPath: /opt/kafka-config
      containers:
        - name: kafka
          image: kafka-jmx:4.1.1
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
            - name: metrics
              containerPort: 19092
          env:
            - name: KAFKA_PROCESS_ROLES
              value: "controller,broker"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENERS
              value: "CONTROLLER://:9093,PLAINTEXT://:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://placeholder:9092"  # overridden at runtime by init container
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_LOG_DIRS
              value: "/opt/kafka/data/log"
            - name: KAFKA_OPTS
              value: "-javaagent:/usr/share/jmx_prometheus_javaagent-1.2.0.jar=19092:/usr/share/kafka_jmx_config.yml"
          command:
            - sh
            - -c
            - |
              if [ -f /opt/kafka-config/envfile ]; then
                export $(cat /opt/kafka-config/envfile | xargs)
              fi
              exec /etc/kafka/docker/run
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: kafka-data
              mountPath: /opt/kafka/data
            - name: kafka-config
              mountPath: /opt/kafka-config
            - name: jmx-config
              mountPath: /usr/share/kafka_jmx_config.yml
              subPath: jmx_exporter_config.yml
      volumes:
        - name: kafka-config
          emptyDir: {}
        - name: jmx-config
          configMap:
            name: kafka-usr-share
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi