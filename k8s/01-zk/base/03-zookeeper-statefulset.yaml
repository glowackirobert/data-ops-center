# ------------------------------------------------------------
# ZooKeeper StatefulSet
# Base is environment-neutral — never apply directly.
# Use an overlay: kubectl apply -k k8s/01-zk/overlays/dev|prod
#
# - myid written per-pod by init container (ordinal + 1)
# - ZOO_SERVERS and replicas are environment-specific (set in overlays)
# ------------------------------------------------------------

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: data-ops-center
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/instance: dev-data-ops-center
    app.kubernetes.io/component: zookeeper
spec:
  serviceName: zookeeper-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
      app.kubernetes.io/instance: dev-data-ops-center
      app.kubernetes.io/component: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/instance: dev-data-ops-center
        app.kubernetes.io/component: zookeeper
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      initContainers:
        - name: init-zookeeper
          image: zookeeper:3.9.2
          command:
            - sh
            - -c
            - |
              ordinal=${HOSTNAME##*-}
              echo $((ordinal + 1)) > /data/myid
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: zookeeper
          image: zookeeper:3.9.2
          ports:
            - name: client
              containerPort: 2181
            - name: follower
              containerPort: 2888
            - name: election
              containerPort: 3888
          env:
            - name: ZOO_CLIENT_PORT
              value: "2181"
            - name: ZOO_CFG_EXTRA
              value: "clientPort=2181"
            - name: ZOO_4LW_COMMANDS_WHITELIST
              value: "ruok,stat,conf,isro"
          startupProbe:
            tcpSocket:
              port: 2181
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 2181
          livenessProbe:
            tcpSocket:
              port: 2181
          volumeMounts:
            - name: data
              mountPath: /data
            - name: datalog
              mountPath: /datalog
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: datalog
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi