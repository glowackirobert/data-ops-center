name: Deploy AWS Lambda

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      LAMBDA_ROLE_ARN: arn:aws:iam::689522024200:role/LambdaDeployRole

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies and prepare zip
        run: |
          mkdir -p aws_lambda
          cd aws_lambda
          pip install requests -t .
          pip install schedule -t .
          pip install boto3 -t .
          cp ../cluster-setup/py/gdansk_public_transport_lambda.py .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.LAMBDA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to AWS Lambda
        uses: aws-actions/aws-lambda-deploy@v1.1.0
        with:
          function-name: GdanskPublicTransportHandler
          code-artifacts-dir: aws_lambda
          handler: gdansk_public_transport_aws.lambda_handler
          runtime: python3.13
