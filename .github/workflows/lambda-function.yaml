name: Deploy AWS Lambda

on:
  push:
    branches:
      - master
    paths:
      - 'cluster-setup/py/gdansk_public_transport_aws.py'
      - '.github/workflows/lambda-function.yaml'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies and prepare zip
        run: |
          mkdir -p aws_lambda
          cd aws_lambda
          # only requests is bundled: boto3 is provided by the Lambda runtime
          pip install 'requests~=2.32' -t .
          cp ../cluster-setup/py/gdansk_public_transport_aws.py .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::689522024200:role/LambdaDeployRole
          aws-region: eu-north-1
          role-session-name: GitHubActions-Lambda-${{ github.run_id }}

      - name: Verify credentials
        run: aws sts get-caller-identity

      - name: Deploy to AWS Lambda
        run: |
          cd aws_lambda
          zip -r ../function.zip .
          aws lambda update-function-code \
            --function-name GdanskPublicTransportHandler \
            --zip-file fileb://../function.zip
          aws lambda wait function-updated \
            --function-name GdanskPublicTransportHandler
          aws lambda update-function-configuration \
            --function-name GdanskPublicTransportHandler \
            --handler gdansk_public_transport_aws.lambda_handler \
            --runtime python3.13
