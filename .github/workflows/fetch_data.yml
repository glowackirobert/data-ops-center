name: Fetch data

on:
  push:
    branches:
      - master

jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      AWS_BUCKET: ${{ vars.AWS_BUCKET_GDANSK_PUBLIC_TRANSPORT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r .github/workflows/requirements.txt
      - run: python cluster-setup/py/gdansk_public_transport_github_action.py

      - name: Calculate date time
        id: time
        run: |
          PREV_HOUR=$(date -u +"%Y-%m-%d-%H")
          YEAR=$(date -u +"%Y")
          MONTH=$(date -u +"%m")
          DAY=$(date -u +"%d")
          FILENAME="./${PREV_HOUR}.txt"
          DEST_DIR="${YEAR}/${MONTH}/${DAY}"
          echo "Previous hour: $PREV_HOUR"
          echo "Date dir: $DEST_DIR"
          echo "file=${FILENAME}" >> $GITHUB_OUTPUT
          echo "date_dir=${DEST_DIR}" >> $GITHUB_OUTPUT

      - name: Debug file listing
        run: ls -la

      - name: Upload to S3
        uses: hkusu/s3-upload-action@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          aws-bucket: ${{ vars.AWS_BUCKET_GDANSK_PUBLIC_TRANSPORT }}
          file-path: ${{ steps.time.outputs.file }}
          destination-dir: "/${{ steps.time.outputs.date_dir }}"
