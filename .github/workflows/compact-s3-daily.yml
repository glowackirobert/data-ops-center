name: Compact S3 daily files

# Concatenates the per-minute/hourly raw/ GPS files on S3 into one gzipped
# JSONL file per day under daily/ (see gdansk_public_transport_s3_compaction.py).
# Runs nightly for yesterday's data; use manual dispatch with a date range
# for backfills. Already-compacted days are skipped, so re-runs are safe.

on:
  schedule:
    - cron: '30 2 * * *'  # 02:30 UTC, well after the previous day is complete
  workflow_dispatch:
    inputs:
      start:
        description: 'Range start (YYYY-MM-DD); defaults to yesterday'
        required: false
      end:
        description: 'Range end (YYYY-MM-DD); defaults to start'
        required: false
      force:
        description: 'Overwrite existing daily files'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

# Queue runs instead of overlapping: a manual backfill and the nightly
# schedule would otherwise compact the same days twice.
concurrency:
  group: compact-s3-daily
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: pip install 'boto3~=1.42'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::689522024200:role/S3AccessRole
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-Compaction-${{ github.run_id }}

      - name: Compute date range
        id: range
        run: |
          START="${{ inputs.start }}"
          END="${{ inputs.end }}"
          if [ -z "$START" ]; then START=$(date -u -d "yesterday" +%F); fi
          if [ -z "$END" ]; then END="$START"; fi
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"

      - name: Run compaction
        run: |
          python cluster-setup/py/gdansk_public_transport_s3_compaction.py \
            --start "${{ steps.range.outputs.start }}" \
            --end "${{ steps.range.outputs.end }}" \
            ${{ inputs.force == true && '--force' || '' }}
