name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    # Only rebuild when image inputs change; docs/config-only pushes would
    # otherwise overwrite all prod tags (compose pulls with --pull always).
    paths:
      - 'kafka-producer-app/**'
      - 'web-app/**'
      - 'cluster-setup/container/Dockerfile.*'
      - 'cluster-setup/table_config/**'
      - 'cluster-setup/pinot/**'
      - '.github/workflows/docker-ci.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAFKA_PRODUCER_MODULE: kafka-producer-app
      APACHE_PINOT: apache-pinot
      WEB_APP: web-app
      SUPERSET: superset

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: docker.io
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Install xmllint
      run: sudo apt-get update && sudo apt-get install -y libxml2-utils

    - name: Extract kafka producer app version from pom.xml
      id: extract_version_kafka_producer_app
      run: |
        VERSION=$(xmllint --xpath "/*[local-name()='project']/*[local-name()='version']/text()" $KAFKA_PRODUCER_MODULE/pom.xml)
        echo "VERSION=$VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build and push Docker image of kafka producer app
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./${{ env.KAFKA_PRODUCER_MODULE }}/Dockerfile.${{ env.KAFKA_PRODUCER_MODULE }}
        push: true
        tags: |
          docker.io/${{ vars.DOCKER_USERNAME }}/${{ env.KAFKA_PRODUCER_MODULE }}:${{ steps.extract_version_kafka_producer_app.outputs.version }}

    - name: Extract Pinot version
      id: extract_version_apache_pinot
      run: |
        VERSION=$(grep -oP 'ARG APACHE_PINOT_VERSION=\K[\d.]+' cluster-setup/container/Dockerfile.apache-pinot)
        echo "VERSION=$VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build and push Docker image of custom Apache Pinot app
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./cluster-setup/container/Dockerfile.${{ env.APACHE_PINOT }}
        push: true
        tags: |
          docker.io/${{ vars.DOCKER_USERNAME }}/${{ env.APACHE_PINOT }}:${{ steps.extract_version_apache_pinot.outputs.version }}

    - name: Extract web app version
      id: extract_version_web_app
      run: |
        VERSION=$(grep -oP 'ARG WEB_APP_VERSION=\K[\d.]+' cluster-setup/container/Dockerfile.web-app)
        echo "VERSION=$VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build and push Docker image of vehicle map web app
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./cluster-setup/container/Dockerfile.${{ env.WEB_APP }}
        push: true
        tags: |
          docker.io/${{ vars.DOCKER_USERNAME }}/${{ env.WEB_APP }}:${{ steps.extract_version_web_app.outputs.version }}

    - name: Extract Superset version
      id: extract_version_superset
      run: |
        VERSION=$(grep -oP 'FROM apache/superset:\K[\d.]+' cluster-setup/container/Dockerfile.${{ env.SUPERSET }})
        echo "VERSION=$VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build and push Docker image of custom Superset
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./cluster-setup/container/Dockerfile.${{ env.SUPERSET }}
        push: true
        tags: |
          docker.io/${{ vars.DOCKER_USERNAME }}/${{ env.SUPERSET }}:${{ steps.extract_version_superset.outputs.version }}