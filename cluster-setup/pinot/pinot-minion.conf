# Adapted from the sample conf in the Pinot image (/opt/pinot/conf/pinot-minion.conf).
# Loaded via "-configFileName /opt/pinot/config/pinot-minion.conf" (container-compose.yml);
# comments must start with '#' - Pinot parses anything else as a property.

# --- Cluster membership ---
pinot.service.role=MINION
pinot.cluster.name=ApachePinot
pinot.zk.server=zookeeper:2181

# --- Identity ---
# Fixed ids and hostnames, so a restarted container rejoins Helix as the same
# instance instead of registering a new one. Changing them strands the tenants
# and segment assignments recorded against the old id.
pinot.set.instance.id.to.hostname=true
pinot.minion.instance.id=Minion_1
pinot.minion.host=pinot-minion

# --- Ports ---
pinot.minion.port=7500

# --- S3 deep store ---
# Minion tasks (MergeRollup) download input segments from S3 and upload the
# merged ones back. Region is repeated in pinot-controller.conf,
# pinot-server.conf and the table_config/ job specs.
pinot.minion.storage.factory.class.s3=org.apache.pinot.plugin.filesystem.S3PinotFS
pinot.minion.storage.factory.s3.region=eu-north-1
pinot.minion.segment.fetcher.protocols=file,http,s3
pinot.minion.segment.fetcher.s3.class=org.apache.pinot.common.utils.fetcher.PinotFSSegmentFetcher
