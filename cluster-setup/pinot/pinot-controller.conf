# Adapted from the sample conf in the Pinot image (/opt/pinot/conf/pinot-controller.conf).
# Loaded via "-configFileName /opt/pinot/config/pinot-controller.conf" (container-compose.yml);
# comments must start with '#' - Pinot parses anything else as a property.

# --- Cluster membership ---
pinot.service.role=CONTROLLER
pinot.cluster.name=ApachePinot
pinot.zk.server=zookeeper:2181

# --- Identity ---
# Fixed ids and hostnames, so a restarted container rejoins Helix as the same
# instance instead of registering a new one. Changing them strands the tenants
# and segment assignments recorded against the old id.
pinot.set.instance.id.to.hostname=true
pinot.controller.instance.id=Controller_1
pinot.controller.host=pinot-controller

# --- Ports ---
controller.port=9000

# --- S3 deep store ---
# Segments live in S3, not on local disk; the volume-mounted local dir is only
# a staging area for uploads. controller.data.dir is filled in at startup from
# the PINOT_CONTROLLER_DATA_DIR env var (set per environment in env/env.*),
# which is what dynamic.env.config enables.
dynamic.env.config=controller.data.dir
controller.data.dir=PINOT_CONTROLLER_DATA_DIR
controller.local.temp.dir=/opt/pinot/data/controller/tmp
# Region is repeated in pinot-server.conf, pinot-minion.conf and the ingestion
# job specs under table_config/ - keep them in sync.
pinot.controller.storage.factory.class.s3=org.apache.pinot.plugin.filesystem.S3PinotFS
pinot.controller.storage.factory.s3.region=eu-north-1
pinot.controller.segment.fetcher.protocols=file,http,s3
pinot.controller.segment.fetcher.s3.class=org.apache.pinot.common.utils.fetcher.PinotFSSegmentFetcher

# --- Minion task scheduler ---
controller.task.scheduler.enabled=true
