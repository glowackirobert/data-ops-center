# Adapted from the sample conf in the Pinot image (/opt/pinot/conf/pinot-server.conf).
# Loaded via "-configFileName /opt/pinot/config/pinot-server.conf" (container-compose.yml);
# comments must start with '#' - Pinot parses anything else as a property.

# --- Cluster membership ---
pinot.service.role=SERVER
pinot.cluster.name=ApachePinot
pinot.zk.server=zookeeper:2181

# --- Identity ---
# Fixed ids and hostnames, so a restarted container rejoins Helix as the same
# instance instead of registering a new one. Changing them strands the tenants
# and segment assignments recorded against the old id.
pinot.set.instance.id.to.hostname=true
pinot.server.instance.id=Server_1
pinot.server.host=pinot-server

# --- Ports ---
# Netty port serves queries; the admin API port also backs the healthcheck.
pinot.server.netty.port=8098
pinot.server.adminapi.port=8097

# --- Controller endpoint ---
pinot.controller.host=pinot-controller
pinot.controller.port=9000

# --- Local storage ---
# dataDir is volume-mounted (../volumes/pinot/server); segmentTarDir is scratch
# space for segments being tarred/untarred.
pinot.server.instance.dataDir=/opt/pinot/pinotServerData
pinot.server.instance.segmentTarDir=/opt/pinot/segmentTarDir

# --- S3 deep store ---
# Downloads segments straight from their deep-store URIs. Region is repeated in
# pinot-controller.conf, pinot-minion.conf and the table_config/ job specs.
pinot.server.storage.factory.class.s3=org.apache.pinot.plugin.filesystem.S3PinotFS
pinot.server.storage.factory.s3.region=eu-north-1
pinot.server.segment.fetcher.protocols=file,http,s3
pinot.server.segment.fetcher.s3.class=org.apache.pinot.common.utils.fetcher.PinotFSSegmentFetcher
