# Pinot Role
pinot.service.role=CONTROLLER

# Pinot Cluster name
pinot.cluster.name=ApachePinot

# Pinot Zookeeper Server
pinot.zk.server=zookeeper:2181

# Use hostname as Pinot Instance ID other than IP
pinot.set.instance.id.to.hostname=true

# Instance ID and hostname
pinot.controller.instance.id=Controller_1
pinot.controller.host=pinot-controller

controller.port=9000

# S3 deep store: segments pushed from clients live in S3, not on local disk.
# The local dir (still volume-mounted) is only a staging area for uploads.
dynamic.env.config=controller.data.dir
controller.data.dir=PINOT_CONTROLLER_DATA_DIR
controller.local.temp.dir=/opt/pinot/data/controller/tmp
pinot.controller.storage.factory.class.s3=org.apache.pinot.plugin.filesystem.S3PinotFS
pinot.controller.storage.factory.s3.region=eu-north-1
pinot.controller.segment.fetcher.protocols=file,http,s3
pinot.controller.segment.fetcher.s3.class=org.apache.pinot.common.utils.fetcher.PinotFSSegmentFetcher

# Minion task scheduler
controller.task.scheduler.enabled=true
