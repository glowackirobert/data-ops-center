# Pinot Role
pinot.service.role=MINION

# Pinot Cluster name
pinot.cluster.name=ApachePinot

# Pinot Zookeeper Server
pinot.zk.server=zookeeper:2181

# Use hostname as Pinot Instance ID other than IP
pinot.set.instance.id.to.hostname=true

# Instance ID and hostname
pinot.minion.instance.id=Minion_1
pinot.minion.host=pinot-minion

# Pinot Minion Port
pinot.minion.port=7500

# S3 deep store: minion tasks (MergeRollup) download input segments from S3
# and upload merged ones back
pinot.minion.storage.factory.class.s3=org.apache.pinot.plugin.filesystem.S3PinotFS
pinot.minion.storage.factory.s3.region=eu-north-1
pinot.minion.segment.fetcher.protocols=file,http,s3
pinot.minion.segment.fetcher.s3.class=org.apache.pinot.common.utils.fetcher.PinotFSSegmentFetcher
