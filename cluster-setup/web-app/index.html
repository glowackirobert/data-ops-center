<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gdansk Public Transport</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<script src="https://unpkg.com/mapbox-gl@3.25.0/dist/mapbox-gl.js"
        integrity="sha384-8BzM5kw/yLQ/0xcikcw1iUchzAgzTDpKxvDZ/UBmlheYzR4QhmFFYNgSFWHAEZls"
        crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://unpkg.com/mapbox-gl@3.25.0/dist/mapbox-gl.css"
      integrity="sha384-fML+8Zffp1mTkSYjqh4tm+BMWAuAz/AW8KbK6bv5/PptIdD2sVCGkmEbFpc6Cq6F"
      crossorigin="anonymous">
<script src="https://unpkg.com/deck.gl@9.3.6/dist.min.js"
        integrity="sha384-UX+cI12FBGambH8nU4vd3AUqzXpQ/NHM4mLI4wbBRYT9AtLRJjKgzYQQeGShiAdR"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/@superset-ui/embedded-sdk@0.1.3/bundle/index.js"
        integrity="sha384-Owp1PydXFMoJUkKVVTEx/sJuBgNmoAibv3LOg60P6zCv+t+X6jISsuvrElGHTsRe"
        crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; }
  header {
    position: absolute; top: 0; left: 0; right: 0; height: 46px; z-index: 20;
    background: #1f2937; color: #f9fafb; display: flex; align-items: center;
    gap: 24px; padding: 0 16px; box-sizing: border-box;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  nav { display: flex; gap: 4px; }
  nav button {
    background: none; border: 0; color: #9ca3af; font: inherit;
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
  }
  nav button.active { background: #374151; color: #fff; }
  .view { position: absolute; top: 46px; bottom: 0; left: 0; right: 0; }
  .hidden { display: none; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    background: rgba(255, 255, 255, 0.92); border-radius: 6px;
    padding: 8px 12px; font-size: 13px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    display: flex; align-items: center; gap: 10px;
  }
  #route-filter { font: inherit; max-width: 140px; }
  #dash-view iframe { width: 100%; height: 100%; border: 0; }
  #dash-status { padding: 24px; color: #374151; }
  #dash-status.error { color: #b91c1c; }
</style>
</head>
<body>
<header>
  <h1>Gdansk Public Transport</h1>
  <nav>
    <button id="tab-map" class="active">Live Map</button>
    <button id="tab-dash">Analytics</button>
  </nav>
</header>
<div id="map-view" class="view">
  <div id="map" style="position:absolute; inset:0;"></div>
  <div id="panel">
    <select id="route-filter" aria-label="Filter by route" disabled>
      <option value="">All vehicles</option>
    </select>
    <span id="panel-status">Loading…</span>
  </div>
</div>
<div id="dash-view" class="view hidden">
  <div id="dash-status">Loading dashboard…</div>
</div>
<script type="module">
const REFRESH_MS = 30000;

const PALETTE = [
  [31,119,180],[255,127,14],[44,160,44],[214,39,40],[148,103,189],
  [140,86,75],[227,119,194],[127,127,127],[188,189,34],[23,190,207],
  [0,122,135],[255,20,147],[70,130,180],[210,105,30],[60,179,113],
];

function colorForRoute(route) {
  let h = 0;
  for (const ch of String(route || '?')) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

// 24-hour clock regardless of the browser's locale (h23 avoids the "24:xx"
// midnight quirk of hour12: false).
function time24(ms) {
  return new Date(ms).toLocaleTimeString([], { hourCycle: 'h23' });
}

function tooltip({ object: d }) {
  if (!d) return null;
  return {
    html: `<b>Route:</b> ${d.route}<br>
           <b>Headsign:</b> ${d.headsign || '—'}<br>
           <b>Delay:</b> ${(d.delay / 60).toFixed(1)} min<br>
           <b>Speed:</b> ${d.speed} km/h<br>
           <b>Seen:</b> ${time24(d.lastSeen)}`,
  };
}

// Gdansk tram routes are 1-2 digits; 3-digit and N-prefixed routes are buses
// (same heuristic as the dashboard queries).
function isTram(route) {
  return /^\d{1,2}$/.test(String(route || ''));
}

// Marker layout, everything anchored on the vehicle position (route text
// centred at 0):  [ ↑ route ]
// The arrow sits inside the box's left backgroundPadding; its offset tracks
// half the route text width (~8 px per glyph at size 14 bold).
function routeTextWidth(d) {
  return String(d.route || '?').length * 8;
}
function arrowOffset(d) {
  return [-(routeTextWidth(d) / 2 + 9), 0];
}

let map = null;

const INITIAL_VIEW = { center: [18.6466, 54.352], zoom: 14 }; // Gdansk Old Town

async function initMap() {
  const cfg = await (await fetch('/api/config')).json();
  mapboxgl.accessToken = cfg.mapboxToken;

  // The map is created exactly once; refreshes below never touch it.
  map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/streets-v9',
    ...INITIAL_VIEW,
  });
  map.addControl(new mapboxgl.NavigationControl(), 'top-right');

  const overlay = new deck.MapboxOverlay({ layers: [], getTooltip: tooltip });
  map.addControl(overlay);

  // Debug hooks for automated testing
  globalThis._map = map;
  globalThis._log = [];
  map.on('moveend', () => globalThis._log.push(
    { t: Date.now(), ev: 'moveend', zoom: map.getZoom() }));

  const statusEl = document.getElementById('panel-status');
  const routeSelect = document.getElementById('route-filter');

  let lastRows = [];
  let lastUpdated = 0;
  let routeKey = ''; // signature of the routes currently in the dropdown

  // Rebuild the dropdown only when the set of routes actually changes, so an
  // open dropdown isn't yanked shut by the 30 s refresh. The user's selection
  // survives the rebuild.
  function rebuildRouteOptions(rows) {
    const routes = [...new Set(rows.map(d => String(d.route || '?')))]
      .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    const key = routes.join('|');
    if (key === routeKey) return;
    routeKey = key;
    const selected = routeSelect.value;
    routeSelect.innerHTML = '';
    routeSelect.append(new Option('All vehicles', ''));
    for (const [label, group] of [
      ['Trams', routes.filter(isTram)],
      ['Buses', routes.filter(r => !isTram(r))],
    ]) {
      if (!group.length) continue;
      const g = document.createElement('optgroup');
      g.label = label;
      for (const r of group) g.append(new Option(r, r));
      routeSelect.append(g);
    }
    routeSelect.value = routes.includes(selected) ? selected : '';
    routeSelect.disabled = false;
  }

  function render() {
    const route = routeSelect.value;
    const rows = route
      ? lastRows.filter(d => String(d.route || '?') === route)
      : lastRows;
    // Markers jump to the newly scraped position on each refresh — no
    // interpolated movement between API polls.
    // Only the vehicle layers are replaced; deck.gl diffs them on the GPU
    // and the base map keeps its tiles, camera and WebGL context.
    overlay.setProps({
      layers: [
        // Route-number box — the text background is the box itself, with
        // extra left padding reserving room for the heading arrow.
        new deck.TextLayer({
          id: 'vehicles',
          data: rows,
          characterSet: 'auto',
          getText: d => String(d.route || '?'),
          getPosition: d => [d.lon, d.lat],
          getSize: 14,
          getColor: [255, 255, 255],
          fontFamily: 'system-ui, sans-serif',
          fontWeight: 700,
          background: true,
          getBackgroundColor: d => colorForRoute(d.route),
          backgroundPadding: [18, 3, 6, 3],
          getBorderColor: [255, 255, 255, 200],
          getBorderWidth: 1,
          pickable: true,
        }),
        // Heading arrow in the left slot of the box, pointing where the
        // vehicle is going. Stationary vehicles get no arrow — their
        // heading is meaningless.
        new deck.TextLayer({
          id: 'vehicle-arrows',
          data: rows.filter(d => d.speed > 0),
          characterSet: ['↑'],
          getText: () => '↑',
          getPosition: d => [d.lon, d.lat],
          getPixelOffset: arrowOffset,
          // deck.gl angles are counter-clockwise; compass bearings clockwise
          getAngle: d => -(d.direction || 0),
          getColor: [255, 255, 255],
          getSize: 17,
          fontFamily: 'system-ui, sans-serif',
          fontWeight: 700,
        }),
      ],
    });
    statusEl.textContent =
      (route ? `${rows.length} of ${lastRows.length}` : `${rows.length}`)
      + ` vehicles · updated ${time24(lastUpdated)}`;
  }

  // While a line is selected the camera follows it: fitted on selection and
  // re-fitted after every refresh, so the whole line stays in view as the
  // vehicles move. With "All vehicles" the refresh never moves the map.
  function fitToSelection() {
    const route = routeSelect.value;
    if (!route) {
      map.flyTo(INITIAL_VIEW);
      return;
    }
    const rows = lastRows.filter(d => String(d.route || '?') === route);
    if (!rows.length) return;
    const bounds = new mapboxgl.LngLatBounds();
    for (const d of rows) bounds.extend([d.lon, d.lat]);
    // maxZoom keeps a single-vehicle line from zooming into rooftop level.
    map.fitBounds(bounds, { padding: 80, maxZoom: 15 });
  }

  routeSelect.onchange = () => {
    render();
    fitToSelection();
  };

  async function refresh() {
    try {
      const resp = await fetch('/api/positions');
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      lastRows = await resp.json();
      lastUpdated = Date.now();
      rebuildRouteOptions(lastRows);
      render();
      if (routeSelect.value) fitToSelection();
      globalThis._log.push({ t: Date.now(), ev: 'refresh', n: lastRows.length, zoom: map.getZoom() });
    } catch (err) {
      statusEl.textContent = `Refresh failed: ${err.message}`;
      globalThis._log.push({ t: Date.now(), ev: 'refresh-error', msg: err.message });
    }
  }

  await refresh();
  setInterval(refresh, REFRESH_MS);
}

let dashboardEmbedded = false;

async function initDashboard() {
  if (dashboardEmbedded) return;
  dashboardEmbedded = true;
  const status = document.getElementById('dash-status');
  try {
    const first = await (await fetch('/api/guest-token')).json();
    if (first.error) throw new Error(first.error);
    await supersetEmbeddedSdk.embedDashboard({
      id: first.embeddedUuid,
      supersetDomain: first.supersetDomain,
      mountPoint: document.getElementById('dash-view'),
      fetchGuestToken: async () =>
        (await (await fetch('/api/guest-token')).json()).token,
      dashboardUiConfig: {
        hideTitle: true,
        hideTab: true,
        hideChartControls: true, // no three-dot menu (edit chart, download, …)
        // keep the filter bar open so the report date-range picker is visible
        filters: { expanded: true },
      },
    });
    status.remove();
  } catch (err) {
    dashboardEmbedded = false; // allow retry on next tab switch
    status.textContent = `Failed to load dashboard: ${err.message}`;
    status.classList.add('error');
  }
}

function showTab(name) {
  const isMap = name === 'map';
  document.getElementById('map-view').classList.toggle('hidden', !isMap);
  document.getElementById('dash-view').classList.toggle('hidden', isMap);
  document.getElementById('tab-map').classList.toggle('active', isMap);
  document.getElementById('tab-dash').classList.toggle('active', !isMap);
  if (isMap && map) map.resize(); // container was display:none while hidden
  if (!isMap) initDashboard();
}

document.getElementById('tab-map').onclick = () => showTab('map');
document.getElementById('tab-dash').onclick = () => showTab('dash');

await initMap();
</script>
</body>
</html>
