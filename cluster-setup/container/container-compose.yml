services:
  zookeeper:
    image: zookeeper:3.9.2
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - 2181:2181
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,stat,conf,isro"
    volumes:
      - ../volumes/zoo-data:/data
      - ../volumes/zoo-log:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc 127.0.0.1 2181 | grep imok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - pinot-network

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - 9092:9092   # container
      - 29092:29092 # localhost
      - 19092:19092 # metrics
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "CONTROLLER://:9093, INTERNAL://:9092, EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092, EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: "/opt/kafka/data/log"
      KAFKA_OPTS: "-javaagent:/usr/share/jmx_prometheus_javaagent-1.2.0.jar=19092:/usr/share/kafka_jmx_config.yml"
    deploy:
      replicas: ${KAFKA_REPLICAS:-1}
    volumes:
      - ../jmx_exporter/:/usr/share/
      - ../volumes/kafka-data:/opt/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "env -u KAFKA_OPTS /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - pinot-network

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.5
    container_name: schema-registry
    restart: unless-stopped
    ports:
      - 8081:8081
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:9092"
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8081/ || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - pinot-network

  pinot-controller:
    image: ${DOCKER_IMAGE_BASE_PATH}apache-pinot:${APACHE_PINOT_VERSION}
    command: "StartController -configFileName /opt/pinot/config/pinot-controller.conf"
    container_name: pinot-controller
    hostname: pinot-controller
    restart: unless-stopped
    ports:
      - 9000:9000
      - 19000:19000
    environment:
      JAVA_OPTS: "-Dplugins.dir=/opt/pinot/plugins -Xms1G -Xmx2G -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Xlog:gc:gc-pinot-controller.log -javaagent:/opt/pinot/etc/jmx_prometheus_javaagent/jmx_prometheus_javaagent.jar=19000:/opt/pinot/etc/jmx_prometheus_javaagent/configs/controller.yml"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ../volumes/pinot/controller:/opt/pinot/data/controller
    depends_on:
      zookeeper:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - pinot-network

  pinot-broker:
    image: ${DOCKER_IMAGE_BASE_PATH}apache-pinot:${APACHE_PINOT_VERSION}
    command: "StartBroker -configFileName /opt/pinot/config/pinot-broker.conf"
    container_name: pinot-broker
    hostname: pinot-broker
    restart: unless-stopped
    ports:
      - 8099:8099
      - 18099:18099
    environment:
      JAVA_OPTS: "-Dplugins.dir=/opt/pinot/plugins -Xms1G -Xmx2G -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Xlog:gc:gc-pinot-broker.log -javaagent:/opt/pinot/etc/jmx_prometheus_javaagent/jmx_prometheus_javaagent.jar=18099:/opt/pinot/etc/jmx_prometheus_javaagent/configs/broker.yml"
    depends_on:
      pinot-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8099/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - pinot-network

  pinot-server:
    image: ${DOCKER_IMAGE_BASE_PATH}apache-pinot:${APACHE_PINOT_VERSION}
    command: "StartServer -configFileName /opt/pinot/config/pinot-server.conf"
    container_name: pinot-server
    hostname: pinot-server
    restart: unless-stopped
    ports:
      - 8098:8098 # client queries
      - 8097:8097 # admin API
      - 18098:18098 # prometheus
    environment:
      JAVA_OPTS: "-Dplugins.dir=/opt/pinot/plugins -Xms2G -Xmx8G -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Xlog:gc:gc-pinot-server.log -javaagent:/opt/pinot/etc/jmx_prometheus_javaagent/jmx_prometheus_javaagent.jar=18098:/opt/pinot/etc/jmx_prometheus_javaagent/configs/server.yml"
    volumes:
      - ../volumes/pinot/server:/opt/pinot/pinotServerData
    depends_on:
      pinot-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8097/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - pinot-network

  pinot-minion:
    image: ${DOCKER_IMAGE_BASE_PATH}apache-pinot:${APACHE_PINOT_VERSION}
    command: "StartMinion -configFileName /opt/pinot/config/pinot-minion.conf"
    container_name: pinot-minion
    hostname: pinot-minion
    restart: unless-stopped
    ports:
      - 7500:7500
      - 17500:17500
    environment:
      JAVA_OPTS: "-Dplugins.dir=/opt/pinot/plugins -Xms1G -Xmx2G -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Xlog:gc:gc-pinot-minion.log -javaagent:/opt/pinot/etc/jmx_prometheus_javaagent/jmx_prometheus_javaagent.jar=17500:/opt/pinot/etc/jmx_prometheus_javaagent/configs/minion.yml"
    depends_on:
      pinot-server:
        condition: service_healthy
    networks:
      - pinot-network

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - 9090:9090
    volumes:
      - ../prometheus:/etc/prometheus
    networks:
      - pinot-network

  grafana:
    image: grafana/grafana:11.4.8
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ../volumes/grafana/provisioning:/etc/grafana/provisioning
      - ../volumes/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - pinot-network

  kafka-producer:
    profiles: ["init"]
    image: ${DOCKER_IMAGE_BASE_PATH}kafka-producer-app:1.0.0
    container_name: kafka-producer-app
    restart: no
    depends_on:
      schema-registry:
        condition: service_healthy
    networks:
      - pinot-network

  pinot-command-runner:
    profiles: ["init"]
    image: ${DOCKER_IMAGE_BASE_PATH}apache-pinot:${APACHE_PINOT_VERSION}
    container_name: pinot-command-runner
    entrypoint: [ "/bin/bash" ]
    command: [ "/opt/pinot/scripts/add-tables.sh" ]
    restart: "no"
    environment:
      - JAVA_OPTS=-Dpinot.admin.system.exit=true -Xmx512m
    depends_on:
      pinot-server:
        condition: service_healthy
    networks:
      - pinot-network

networks:
  pinot-network:
    name: pinot-network
    driver: bridge
