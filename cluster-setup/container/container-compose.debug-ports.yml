# Opt-in override that re-publishes four internal-only ports, for debugging:
#
#   - Prometheus  9090  — /targets, the only view of whether a JMX scrape is up
#   - Alloy      12345  — the only view of whether Docker log discovery is working
#   - Pinot broker 8099 — scripts/load_test_broker.py defaults to localhost:8099
#   - Pinot controller 9000 — the cluster UI, and what host-run
#                             table_config/add-tables.sh and web-app/server.py
#                             point at (PINOT_CONTROLLER_URL). In prod it is
#                             reached only through Caddy (pinot.${BASE_DOMAIN}),
#                             which puts basic auth in front of an API that can
#                             delete tables and segments.
#
#   docker compose --env-file cluster-setup/env/versions.env \
#     --env-file cluster-setup/env/env.dev \
#     -f cluster-setup/container/container-compose.yml \
#     -f cluster-setup/container/container-compose.debug-ports.yml up -d
#
# Bound to ${DEBUG_BIND:-127.0.0.1} — defaults to loopback-only, independent of
# ${BIND} (the three main published ports), because these four have no
# authentication of any kind and must not ride along whenever BIND happens to
# be 0.0.0.0 (dev's default). Only flip DEBUG_BIND to 0.0.0.0 on a host with no
# other way in (e.g. EC2 without a domain, Caddy not running) and lock the
# security group down to your own IP first — see the "no domain yet" mode in
# README-ec2.md. Revert to loopback (drop the DEBUG_BIND line) once Caddy is
# back in front.
#
# Nothing else belongs here. Loki is already queryable through Grafana, which is
# published; ZooKeeper, Schema Registry and the Pinot server/minion expose
# CLI-shaped admin APIs reachable with `docker exec`, or from a throwaway
# container on the bridge:
#
#   docker run --rm --network pinot-network curlimages/curl -s \
#     http://pinot-server:8097/health
#
# Kafka is unpublishable by design — its advertised listener is
# INTERNAL://kafka:9092, so a host client is handed an address it cannot
# resolve. Use `docker exec kafka ...` instead.

services:
  pinot-controller:
    ports:
      - "${DEBUG_BIND:-127.0.0.1}:9000:9000"

  pinot-broker:
    ports:
      - "${DEBUG_BIND:-127.0.0.1}:8099:8099"

  prometheus:
    ports:
      - "${DEBUG_BIND:-127.0.0.1}:9090:9090"

  alloy:
    ports:
      - "${DEBUG_BIND:-127.0.0.1}:12345:12345"
