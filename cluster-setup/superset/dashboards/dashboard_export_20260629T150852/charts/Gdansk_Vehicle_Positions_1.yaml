  slice_name: Gdansk Vehicle Positions
  description: null
  certified_by: null
  certification_details: null
  viz_type: deck_scatter
  params:
    datasource: 1__table
    viz_type: deck_scatter
    spatial:
      type: latlong
      latCol: lat
      lonCol: lon
    row_limit: 5000
    filter_nulls: true
    adhoc_filters:
    - clause: WHERE
      comparator: 'DATEADD(DATETIME("now"), -2, minute) : now'
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      subject: generatedTransformed
    mapbox_style: https://api.maptiler.com/maps/streets-v2/style.json?key=__MAPTILER_API_KEY__
    autozoom: true
    viewport:
      bearing: 0
      latitude: 54.35
      longitude: 18.65
      pitch: 0
      zoom: 11
    point_radius_fixed:
      type: fix
      value: 1000
    point_unit: square_m
    min_radius: 2
    max_radius: 250
    multiplier: 1
    color_picker:
      a: 1
      b: 135
      g: 122
      r: 0
    legend_position: tr
    legend_format: SMART_NUMBER
    dimension: routeShortName
    color_scheme: supersetColors
    js_columns:
    - headsign
    - delay
    js_tooltip: |
      function(o) {
        if (!o || !o.object) return '';
        var d = o.object;
        var extra = d.extraProps || {};
        function toDMS(dec, posLabel, negLabel) {
          var abs = Math.abs(dec);
          var deg = Math.floor(abs);
          var minFull = (abs - deg) * 60;
          var min = Math.floor(minFull);
          var sec = Math.round((minFull - min) * 60);
          return deg + '\xb0 ' + min + "' " + sec + '" ' + (dec >= 0 ? posLabel : negLabel);
        }
        return '<b>Route:</b> ' + (d.cat_color || '?') + '<br>'
             + '<b>Headsign:</b> ' + (extra.headsign || '—') + '<br>'
             + '<b>Delay:</b> ' + (extra.delay !== undefined ? (extra.delay / 60).toFixed(1) + ' min' : '—') + '<br>'
             + '<b>Lat:</b> ' + toDMS(d.position[1], 'N', 'S') + '<br>'
             + '<b>Lon:</b> ' + toDMS(d.position[0], 'E', 'W');
      }
    time_grain_sqla: null
    granularity: null
    extra_form_data: {}
    dashboards: []
  query_context: ''
  cache_timeout: 0
