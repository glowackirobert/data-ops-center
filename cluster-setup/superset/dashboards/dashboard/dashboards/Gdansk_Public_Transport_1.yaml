metadata:
  native_filter_configuration:
  - id: NATIVE_FILTER-reportDateRange00
    name: Report date range
    filterType: filter_time
    targets: []
    cascadeParentIds: []
    defaultDataMask:
      extraFormData:
        time_range: 'DATEADD(DATETIME("today"), -10, day) : DATETIME("today")'
      filterState:
        value: 'DATEADD(DATETIME("today"), -10, day) : DATETIME("today")'
    controlValues:
      enableEmptyFilter: false
    scope:
      rootPath:
      - ROOT_ID
      excluded: []
    chartsInScope:
    - 2
    - 4
    - 5
    - 6
    - 9
    - 11
    - 12
    - 13
    - 14
    - 15
    tabsInScope:
    - TAB-trams000000000000000
    - TAB-buses000000000000000
    - TAB-nightBuses00000000000
    - TAB-byRoute0000000000000
    type: NATIVE_FILTER
    description: 'Date window for every chart on every tab, last 10 days by default. Both ends are anchored to midnight on purpose - a
      window that cuts a day in half stops the star-tree from answering the query
      and makes the heatmap day count wobble between refreshes.'
  - id: NATIVE_FILTER-routePicker000000
    name: Route
    filterType: filter_select
    targets:
    - datasetUuid: 0fd033bf-2b72-4a3d-9cc5-740588b70c37
      column:
        name: routeShortName
    cascadeParentIds: []
    defaultDataMask:
      extraFormData: {}
      filterState:
        value: null
      ownState: {}
    controlValues:
      enableEmptyFilter: false
      multiSelect: false
    scope:
      rootPath:
      - ROOT_ID
      excluded: []
    chartsInScope:
    - 2
    - 4
    - 5
    - 6
    - 9
    - 11
    - 12
    - 13
    - 14
    - 15
    tabsInScope:
    - TAB-trams000000000000000
    - TAB-buses000000000000000
    - TAB-nightBuses00000000000
    - TAB-byRoute0000000000000
    type: NATIVE_FILTER
    description: 'Route shown across every tab; defaults to all routes. Picking one
      narrows the punctuality and speed charts to that single line, so a route that
      is not part of the tab''s category leaves that tab empty.'
  chart_configuration: {}
  global_chart_configuration:
    scope:
      rootPath:
