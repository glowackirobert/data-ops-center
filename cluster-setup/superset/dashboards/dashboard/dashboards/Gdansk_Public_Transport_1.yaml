metadata:
  native_filter_configuration:
  - id: NATIVE_FILTER-reportDateRange00
    name: Report date range
    filterType: filter_time
    targets: []
    cascadeParentIds: []
    defaultDataMask:
      extraFormData:
        time_range: No filter
      filterState:
        value: No filter
    controlValues:
      enableEmptyFilter: false
    scope:
      rootPath:
      - ROOT_ID
      excluded:
      - 7
      - 6
      - 8
      - 9
    # chartsInScope uses this file's position chartIds (P2=2, P4=4, P5=5,
    # Tram=10, Bus=11, NightBus=12), but the Superset importer only remaps
    # scope.excluded — after (re-)importing, fix chartsInScope to the live
    # chart ids via PUT /api/v1/dashboard/{id}.
    chartsInScope:
    - 2
    - 4
    - 5
    - 10
    - 11
    - 12
    tabsInScope: []
    type: NATIVE_FILTER
    description: Date window for the report (applies to P2, P4, P5 and the three
      P3 punctuality-by-category charts). Defaults to whole history — P2 still
      effectively shows the last 24h since it carries its own fixed window; narrow
      this to shrink the others' window too.
  - id: NATIVE_FILTER-routePicker000000
    name: Route
    filterType: filter_select
    targets:
    - datasetUuid: 0fd033bf-2b72-4a3d-9cc5-740588b70c37
      column:
        name: routeShortName
    cascadeParentIds: []
    defaultDataMask:
      extraFormData: {}
      filterState:
        value: null
      ownState: {}
    controlValues:
      enableEmptyFilter: false
      multiSelect: false
    scope:
      rootPath:
      - ROOT_ID
      excluded:
      - 7
      - 3
      - 5
      - 8
    # chartsInScope uses this file's position chartIds (P2=2, P4=4, P6=6, P8=9), but
    # the Superset importer only remaps scope.excluded — after (re-)importing, fix
    # chartsInScope to the live P2/P4/P6/P8 chart ids via PUT /api/v1/dashboard/{id}.
    chartsInScope:
    - 2
    - 4
    - 6
    - 9
    tabsInScope: []
    type: NATIVE_FILTER
    description: Route shown (applies to P2, P4, P6 and P8); defaults to all routes,
      optionally narrow to one
  chart_configuration: {}
  global_chart_configuration:
    scope:
      rootPath:
      - ROOT_ID
      excluded: []
    chartsInScope:
    - 2
    - 7
    - 10
    - 11
    - 12
    - 4
    - 5
    - 6
    - 8
    - 9
  map_label_colors: {}
  color_scheme: ''
  refresh_frequency: 10
  color_scheme_domain: []
  expanded_slices: {}
  label_colors:
    pct_on_time: '#5ac189'
    pct_late: '#e04355'
    pct_early: '#d63cbe'
  shared_label_colors: []
  timed_refresh_immune_slices: []
  cross_filters_enabled: true
  default_filters: '{}'
version: 1.0.0
