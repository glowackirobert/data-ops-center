slice_name: Most delayed vehicles (last 7 days)
description: 'Chronic offenders: vehicles that run late most consistently, by
  route and fleet number. Average and worst delay in minutes over the last week;
  parked-at-depot snapshots and depot return trips are excluded, and vehicles
  with fewer than 30 observations are ignored to keep the ranking meaningful.'
certified_by: null
certification_details: null
viz_type: table
params:
  datasource: 1__table
  viz_type: table
  query_mode: aggregate
  groupby:
  - routeShortName
  - vehicleCode
  metrics:
  - expressionType: SQL
    sqlExpression: ROUNDDECIMAL(AVG(delay) / 60.0, 1)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: avg_delay_min
  - expressionType: SQL
    sqlExpression: ROUNDDECIMAL(MAX(delay) / 60.0, 0)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: max_delay_min
  - expressionType: SQL
    sqlExpression: COUNT(*)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: observations
  all_columns: []
  percent_metrics: []
  adhoc_filters:
  - clause: WHERE
    comparator: 'DATEADD(DATETIME("now"), -7, day) : now'
    expressionType: SIMPLE
    operator: TEMPORAL_RANGE
    subject: generatedTransformed
  timeseries_limit_metric:
    expressionType: SQL
    sqlExpression: AVG(delay)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: sort_avg_delay
  order_desc: true
  row_limit: 20
  server_pagination: false
  table_timestamp_format: smart_date
  show_cell_bars: true
  color_pn: false
  allow_render_html: true
  extra_form_data: {}
  dashboards: []
query_context: ''
cache_timeout: 3600
