# Stale-delay snapshots are filtered out: a vehicle standing at a depot or terminus keeps
# reporting its last delay, which would otherwise top the ranking. Only the stationary +
# implausible-delay test is used - matching the headsign against 'zajezdnia' missed the
# terminus case entirely and only caught depot-bound runs.
# Groups by vehicleCode, which the star-tree does not cover, so this one scans.
slice_name: Most delayed vehicles
description: Vehicles running late most consistently over the selected window, by line and fleet number.
certified_by: null
certification_details: null
viz_type: table
params:
  datasource: 1__table
  viz_type: table
  query_mode: aggregate
  groupby:
  - routeShortName
  - vehicleCode
  metrics:
  - expressionType: SQL
    sqlExpression: ROUNDDECIMAL(AVG(delay) / 60.0, 1)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: avg_delay_min
  - expressionType: SQL
    sqlExpression: ROUNDDECIMAL(MAX(delay) / 60.0, 0)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: max_delay_min
  - expressionType: SQL
    sqlExpression: COUNT(*)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: observations
  all_columns: []
  percent_metrics: []
  adhoc_filters:
  - clause: WHERE
    expressionType: SQL
    sqlExpression: NOT (speed = 0 AND delay > 1200)
    comparator: null
    operator: null
    subject: null
  timeseries_limit_metric:
    expressionType: SQL
    sqlExpression: AVG(delay)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: sort_avg_delay
  order_desc: true
  row_limit: 20
  server_pagination: false
  table_timestamp_format: smart_date
  show_cell_bars: true
  color_pn: false
  allow_render_html: true
  extra_form_data: {}
  dashboards: []
query_context: ''
cache_timeout: -1
