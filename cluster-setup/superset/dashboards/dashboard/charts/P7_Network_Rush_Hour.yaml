slice_name: P7 · Network rush hour (last 24 h)
description: 'When is the network busiest? Hour-by-hour count of active vehicles
  vs. their average speed — the morning and evening peaks put more vehicles on
  the road and drag speed down. Whole network, all routes.'
certified_by: null
certification_details: null
viz_type: echarts_timeseries_line
params:
  datasource: 1__table
  viz_type: echarts_timeseries_line
  x_axis:
    expressionType: SQL
    sqlExpression: TODATETIME(generatedTransformed, 'HH:00', 'Europe/Warsaw')
    label: hour_of_day
  x_axis_sort: hour_of_day
  x_axis_sort_asc: true
  time_grain_sqla: null
  metrics:
  - expressionType: SQL
    sqlExpression: COUNT(DISTINCT vehicleId)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: active_vehicles
  - expressionType: SQL
    sqlExpression: ROUNDDECIMAL(AVG(speed), 1)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: avg_speed_kmh
  groupby: []
  adhoc_filters:
  - clause: WHERE
    comparator: 'DATEADD(DATETIME("now"), -24, hour) : now'
    expressionType: SIMPLE
    operator: TEMPORAL_RANGE
    subject: generatedTransformed
  row_limit: 100
  rich_tooltip: true
  show_legend: true
  markerEnabled: true
  y_axis_format: SMART_NUMBER
  x_axis_title: Hour (local)
  extra_form_data: {}
  dashboards: []
query_context: ''
cache_timeout: 0
