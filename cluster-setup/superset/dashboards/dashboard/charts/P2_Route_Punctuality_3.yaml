slice_name: P2 · Route punctuality (last day)
description: 'Which routes were punctual? One stacked bar per route: on time / late
  / early sum to 100 %. Source: gdansk_public_transport_queries.sql (P2).'
certified_by: null
certification_details: null
viz_type: echarts_timeseries_bar
params:
  datasource: 1__table
  viz_type: echarts_timeseries_bar
  x_axis: routeShortName
  x_axis_sort_asc: true
  time_grain_sqla: null
  metrics:
  - expressionType: SQL
    sqlExpression: ROUNDDECIMAL(SUM(CASE WHEN delay BETWEEN -60 AND 60 THEN 1 ELSE
      0 END) * 100.0 / COUNT(*), 1)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: pct_on_time
  - expressionType: SQL
    sqlExpression: ROUNDDECIMAL(SUM(CASE WHEN delay > 60 THEN 1 ELSE 0 END) * 100.0
      / COUNT(*), 1)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: pct_late
  - expressionType: SQL
    sqlExpression: ROUNDDECIMAL(SUM(CASE WHEN delay < -60 THEN 1 ELSE 0 END) * 100.0
      / COUNT(*), 1)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: pct_early
  groupby: []
  adhoc_filters:
  - clause: WHERE
    comparator: 'DATEADD(DATETIME("now"), -24, hour) : now'
    expressionType: SIMPLE
    operator: TEMPORAL_RANGE
    subject: generatedTransformed
  - clause: WHERE
    expressionType: SQL
    sqlExpression: NOT (speed = 0 AND delay > 1200)
    comparator: null
    operator: null
    subject: null
  row_limit: 100
  stack: Stack
  rich_tooltip: true
  show_legend: true
  y_axis_format: SMART_NUMBER
  x_axis_title: Route
  y_axis_title: '% of snapshots'
  extra_form_data: {}
  dashboards: []
