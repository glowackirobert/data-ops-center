slice_name: Route speed by day — Night buses
description: 'How fast is each night bus route day by day? Commercial speed
  (stops included), one row per route, colored by speed. Window comes from
  the dashboard-level "Report date range" native filter (default last 10
  days, same as the Trams/Buses charts) — see the note on that filter and its
  scope-remapping caveat in Gdansk_Public_Transport_1.yaml. That filter is
  anchored to DATETIME("today") rather than "now" — see the Trams chart''s
  description for why (a "now" anchor made the x-axis column count fluctuate
  between refreshes). Also carries params.granularity_sqla:
  generatedTransformed, required for that filter to actually bind on
  heatmap_v2 — see the Buses chart''s description for why (without it
  Superset silently drops the TEMPORAL_RANGE filter and queries the whole
  unfiltered table). row_limit is 30000 despite the tiny group count — small
  LIMITs make Pinot silently truncate ordered GROUP BY results (Superset adds
  ORDER BY from sort_x_axis/sort_y_axis); see the Trams chart''s description
  for the full story. Split out of P5 into
  three heatmaps (Trams / Buses / Night buses) — see the Trams chart''s
  description for why. Scoped to N-prefixed routes. Row label rebuilds the code
  as N + the route number left-padded to 2 digits (LPAD/REGEXP_EXTRACT/CONCAT)
  so N4 sorts before N14 as text instead of after it. dayBucket is a plain
  VARCHAR (is_dttm: false), so Superset''s date-format control has no effect
  on it — x_axis is a computed SUBSTR(dayBucket, 5, 10) column instead, to
  show "MM-DD" and drop the year that was crowding the axis (matches the
  Trams chart; see its description for why this must be spelled SUBSTR with
  Pinot''s own 0-based (start, end) args rather than ANSI SUBSTRING(x, start,
  length) — Superset''s Pinot SQL compiler rewrites the latter into the
  former without converting the third argument, silently breaking it).
  Source: gdansk_public_transport_queries.sql (P4).'
certified_by: null
certification_details: null
viz_type: heatmap_v2
params:
  datasource: 1__table
  viz_type: heatmap_v2
  granularity_sqla: generatedTransformed
  x_axis:
    expressionType: SQL
    sqlExpression: SUBSTR(dayBucket, 5, 10)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: day
  groupby:
    expressionType: SQL
    sqlExpression: CONCAT('N', LPAD(REGEXP_EXTRACT(routeShortName, '([0-9]+)',
      0), 2, '0'), '')
    column: null
    aggregate: null
    hasCustomLabel: true
    label: route
  metric:
    expressionType: SQL
    sqlExpression: ROUNDDECIMAL(AVG(speed), 1)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: avg_speed_kmh
  adhoc_filters:
  - clause: WHERE
    expressionType: SQL
    sqlExpression: REGEXP_LIKE(routeShortName, '^N')
    comparator: null
    operator: null
    subject: null
  row_limit: 30000
  linear_color_scheme: superset_seq_1
  legend_type: continuous
  normalize_across: heatmap
  sort_x_axis: alpha_asc
  sort_y_axis: alpha_desc
  xscale_interval: -1
  yscale_interval: -1
  value_bounds:
  - null
  - null
  show_legend: true
  show_values: false
  show_percentage: false
  y_axis_format: SMART_NUMBER
  left_margin: auto
  bottom_margin: auto
  extra_form_data: {}
  dashboards: []
query_context: ''
cache_timeout: -1
