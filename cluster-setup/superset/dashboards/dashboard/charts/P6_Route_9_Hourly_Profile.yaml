# Hourly buckets come from Superset's PT1H time grain, not a TODATETIME() expression:
# same rows scanned, about a quarter of the wall time, and a real time axis.
# The one chart no index covers - there is no hour dimension, so its cost grows
# with the selected window while every other chart's does not.
slice_name: Speed and delay by hour
description: Average speed and delay per hour over the selected window; rush hours drag speed down and
  delay up.
certified_by: null
certification_details: null
viz_type: echarts_timeseries_line
params:
  datasource: 1__table
  viz_type: echarts_timeseries_line
  x_axis: generatedTransformed
  x_axis_sort_asc: true
  time_grain_sqla: PT1H
  metrics:
  - expressionType: SQL
    sqlExpression: ROUNDDECIMAL(AVG(speed), 1)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: avg_speed_kmh
  - expressionType: SQL
    sqlExpression: ROUNDDECIMAL(AVG(delay), 0)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: avg_delay_sec
  groupby: []
  adhoc_filters: []
  row_limit: 10000
  rich_tooltip: true
  show_legend: true
  markerEnabled: true
  y_axis_format: SMART_NUMBER
  x_axis_title: Hour (local time)
  extra_form_data: {}
  dashboards: []
query_context: ''
cache_timeout: -1
