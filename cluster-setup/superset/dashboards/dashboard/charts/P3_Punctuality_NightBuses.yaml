# Category filters are IN / range predicates, never REGEXP_LIKE: the star-tree index
# (dayBucket, routeShortName) can answer =, IN and range predicates, and regex sends the
# query to a full scan instead. See ../../../README.md.
slice_name: Punctuality by route — Night buses
description: 'Punctuality per night bus line: on time / late / early, summing to 100 % of snapshots.'
certified_by: null
certification_details: null
viz_type: echarts_timeseries_bar
params:
  datasource: 1__table
  viz_type: echarts_timeseries_bar
  x_axis: routeShortName
  x_axis_sort: sort_key
  x_axis_sort_asc: true
  time_grain_sqla: null
  metrics:
  - expressionType: SQL
    sqlExpression: ROUNDDECIMAL(SUM(isOnTime) * 100.0 / COUNT(*), 1)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: pct_on_time
  - expressionType: SQL
    sqlExpression: ROUNDDECIMAL(SUM(isLate) * 100.0 / COUNT(*), 1)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: pct_late
  - expressionType: SQL
    sqlExpression: 100 - ROUNDDECIMAL(SUM(isOnTime) * 100.0 / COUNT(*), 1) - ROUNDDECIMAL(SUM(isLate)
      * 100.0 / COUNT(*), 1)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: pct_early
  groupby: []
  timeseries_limit_metric:
    expressionType: SQL
    sqlExpression: CAST(REGEXP_EXTRACT(routeShortName, '([0-9]+)', 0) AS INT) + 0
    column: null
    aggregate: null
    hasCustomLabel: true
    label: sort_key
  order_desc: false
  adhoc_filters:
  - clause: WHERE
    expressionType: SQL
    sqlExpression: routeShortName >= 'N' AND routeShortName < 'O'
    comparator: null
    operator: null
    subject: null
  row_limit: 200
  stack: Stack
  sort_series_type: name
  sort_series_ascending: false
  rich_tooltip: true
  show_tooltip_total: false
  show_legend: false
  y_axis_format: SMART_NUMBER
  y_axis_bounds:
  - 0
  - 100
  x_axis_title: Route
  y_axis_title: '% of snapshots'
  extra_form_data: {}
  dashboards: []
query_context: ''
cache_timeout: -1
