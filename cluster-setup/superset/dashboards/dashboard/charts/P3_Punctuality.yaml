slice_name: Punctuality by route
description: 'Which lines were punctual? One stacked bar per line: on time / late
  / early sum to 100 %. Covers every category — trams (1-2 digit routes), numeric
  buses, special-purpose lettered bus codes (e.g. T8, M32) and night buses
  (N-prefixed, e.g. N1, N14) — sorted trams first, then buses (numeric routes
  ascending, then lettered codes), then night buses ascending. This mirrors the
  route grouping/order used by the web app''s Live Map route dropdown
  (cluster-setup/web-app/static/js/map.js buildRouteOptions + utils.js
  isTram/isNightBus). Colored consistently across every route (green/red/magenta
  = on time/late/early) via the dashboard''s label_colors block, keyed by each
  route''s sort_key value — must be updated by hand (and the dashboard
  re-imported) whenever the route list changes, or new routes render with a
  random color. Routes are ordered via x_axis_sort: sort_key, a CASE expression
  kept in timeseries_limit_metric rather than groupby specifically so it
  stays a query-ordering hint instead of an extra dimension — putting it in
  groupby used to work too, but leaked its numeric value into every series
  name in the hover tooltip (e.g. "pct_early, 1512.0"). No legend: Superset''s
  legend has no per-color dedup (only pagination), so with ~100+ routes it''s
  unusable — see the chart''s show_legend: false. Stack order is
  pinned bottom-to-top as on time / late / early via sort_series_type: name +
  sort_series_ascending: false (descending alphabetical: pct_on_time,
  pct_late, pct_early) — without it Superset orders each bar''s stack by
  metric value descending, so whichever status is locally largest for a given
  route ends up on the bottom, making the color order inconsistent
  route-to-route (confirmed via the Pinot broker: e.g. route 183 is
  74.1% late vs 23.2% on time, the reverse of most routes). 34M/34S excluded:
  a one-day, single-vehicle tram-3 rail-replacement service (see P5
  investigation), not a real bus line. Respects the "Report date range"
  dashboard filter (whole history by default). Source:
  gdansk_public_transport_queries.sql (P2).'
certified_by: null
certification_details: null
viz_type: echarts_timeseries_bar
params:
  datasource: 1__table
  viz_type: echarts_timeseries_bar
  x_axis: routeShortName
  x_axis_sort: sort_key
  x_axis_sort_asc: true
  time_grain_sqla: null
  metrics:
  - expressionType: SQL
    sqlExpression: ROUNDDECIMAL(SUM(isOnTime) * 100.0 / COUNT(*), 1)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: pct_on_time
  - expressionType: SQL
    sqlExpression: ROUNDDECIMAL(SUM(isLate) * 100.0 / COUNT(*), 1)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: pct_late
  - expressionType: SQL
    sqlExpression: 100 - ROUNDDECIMAL(SUM(isOnTime) * 100.0 / COUNT(*), 1) - ROUNDDECIMAL(SUM(isLate)
      * 100.0 / COUNT(*), 1)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: pct_early
  groupby: []
  timeseries_limit_metric:
    expressionType: SQL
    sqlExpression: "CASE\n  WHEN REGEXP_LIKE(routeShortName, '^[0-9]{1,2}$') THEN\
      \ CAST(REGEXP_EXTRACT(routeShortName, '([0-9]+)', 0) AS INT)\n  WHEN REGEXP_LIKE(routeShortName,\
      \ '^[0-9]+$') THEN 1000 + CAST(REGEXP_EXTRACT(routeShortName, '([0-9]+)',\
      \ 0) AS INT)\n  WHEN REGEXP_LIKE(routeShortName, '^N') THEN 3000 + CAST(REGEXP_EXTRACT(routeShortName,\
      \ '([0-9]+)', 0) AS INT)\n  ELSE 2000 + CAST(REGEXP_EXTRACT(routeShortName,\
      \ '([0-9]+)', 0) AS INT)\nEND"
    column: null
    aggregate: null
    hasCustomLabel: true
    label: sort_key
  order_desc: false
  adhoc_filters:
  - clause: WHERE
    expressionType: SQL
    sqlExpression: routeShortName NOT IN ('34M', '34S')
    comparator: null
    operator: null
    subject: null
  row_limit: 200
  stack: Stack
  sort_series_type: name
  sort_series_ascending: false
  rich_tooltip: true
  show_tooltip_total: false
  show_legend: false
  y_axis_format: SMART_NUMBER
  y_axis_bounds:
  - 0
  - 100
  x_axis_title: Route
  y_axis_title: '% of snapshots'
  extra_form_data: {}
  dashboards: []
query_context: ''
cache_timeout: 3600
