viz_type: heatmap_v2
params:
  datasource: 1__table
  viz_type: heatmap_v2
  granularity_sqla: generatedTransformed
  x_axis:
    expressionType: SQL
    sqlExpression: SUBSTR(dayBucket, 5, 10)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: day
  groupby:
    expressionType: SQL
    sqlExpression: LPAD(routeShortName, 2, ' ')
    column: null
    aggregate: null
    hasCustomLabel: true
    label: route
  metric:
    expressionType: SQL
    sqlExpression: ROUNDDECIMAL(AVG(speed), 1)
    column: null
    aggregate: null
    hasCustomLabel: true
    label: avg_speed [km/h]
  adhoc_filters:
  - clause: WHERE
    expressionType: SQL
    sqlExpression: REGEXP_LIKE(routeShortName, '^[0-9]{1,2}$')
    comparator: null
    operator: null
    subject: null
  row_limit: 30000
  linear_color_scheme: superset_seq_1
  legend_type: continuous
  normalize_across: heatmap
  sort_x_axis: alpha_asc
  sort_y_axis: alpha_desc
  xscale_interval: -1
  yscale_interval: -1
  value_bounds:
  - null
  - null
  show_legend: true
  show_values: false
  show_percentage: false
  y_axis_format: SMART_NUMBER
  left_margin: auto
  bottom_margin: auto
  extra_form_data: {}
  dashboards: []
